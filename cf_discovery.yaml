  ProductXWAFRMemberRoleStackSet:
    Type: AWS::CloudFormation::StackSet
    Condition: IsOrg
    # Kept so the member roles never precede the hub role, but NOT sufficient
    # on its own: it waits for CloudFormation, not for IAM propagation. The
    # real fix is the member trust policy (see the member template below).
    DependsOn: ProductXWAFRRole
    Properties:
      StackSetName: ProductXWAFRMemberRoleStackSet
      Description: Deploys ProductXWAFRMemberRole to organization member accounts.
      PermissionModel: SERVICE_MANAGED
      CallAs: SELF
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_NAMED_IAM
      # Propagated to every stack instance and to the member roles ? a
      # tag-enforcing SCP in a member account rejects an untagged CreateStack.
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref Owner
      # Concurrent StackSet operations (2026-07-24): without it a second
      # operation on the set ? a stack update while instances are still
      # rolling out ? fails with OperationInProgress.
      ManagedExecution:
        Active: true
      # Without this block CloudFormation defaults to MaxConcurrentCount=1 +
      # FailureToleranceCount=0 + SEQUENTIAL ? a 26-member org takes ~10 min to roll
      # out and any single failing account (SCP-locked, suspended, etc.) halts the
      # whole batch. With 10-wide parallelism the same org onboards in ~75s; tolerance
      # of 5 lets isolated bad members fail without poisoning the rest.
      OperationPreferences:
        MaxConcurrentCount: 10
        FailureToleranceCount: 5
        RegionConcurrencyType: PARALLEL
      Parameters:
        - ParameterKey: ManagementAccountId
          ParameterValue: !Ref 'AWS::AccountId'
        - ParameterKey: ExternalId
          ParameterValue: !Ref ExternalId
        - ParameterKey: Environment
          ParameterValue: !Ref Environment
        - ParameterKey: Owner
          ParameterValue: !Ref Owner
      StackInstancesGroup:
        - DeploymentTargets:
            # TargetOUs is a comma-string here (Type: String ? see Parameters comment);
            # split into the list shape DeploymentTargets.OrganizationalUnitIds expects.
            OrganizationalUnitIds: !Split [',', !Ref TargetOUs]
          Regions:
            - !Ref 'AWS::Region'
      TemplateBody: |
        AWSTemplateFormatVersion: '2010-09-09'
        Description: ProductX WAFR member account read-only role (StackSet-deployed).

        Parameters:
          ManagementAccountId:
            Type: String
          ExternalId:
            Type: String
            NoEcho: true
          Environment:
            Type: String
          Owner:
            Type: String

        Resources:
          ProductXWAFRMemberRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: ProductXWAFRMemberRole
              Tags:
                - Key: Project
                  Value: productx
                - Key: Environment
                  Value: !Ref Environment
                - Key: ManagedBy
                  Value: cloudformation
                - Key: Owner
                  Value: !Ref Owner
              AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                      AWS: !Sub 'arn:aws:iam::${ManagementAccountId}:root'
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        sts:ExternalId: !Ref ExternalId
                        aws:PrincipalArn: !Sub 'arn:aws:iam::${ManagementAccountId}:role/ProductXWAFRRole'
              ManagedPolicyArns:
                - arn:aws:iam::aws:policy/SecurityAudit
                - arn:aws:iam::aws:policy/ReadOnlyAccess
              Policies:
                - PolicyName: ComplianceSignalAccess
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - config:DescribeComplianceByConfigRule
                          - config:GetComplianceDetailsByConfigRule
                          - config:DescribeConfigRules
                          - config:ListDiscoveredResources
                          - securityhub:GetFindings
                          - securityhub:DescribeHub
                          - access-analyzer:ListAnalyzers
                          - access-analyzer:ListFindings
                        Resource: '*'
                - PolicyName: WAFRWorkloadManagement
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Sid: WorkloadLifecycle
                        Effect: Allow
                        Action:
                          - wellarchitected:CreateWorkload
                          - wellarchitected:UpdateWorkload
                          - wellarchitected:DeleteWorkload
                        Resource: '*'
                      - Sid: WorkloadLensManagement
                        Effect: Allow
                        Action:
                          - wellarchitected:AssociateLenses
                          - wellarchitected:DisassociateLenses
                          - wellarchitected:UpgradeLensReview
                          - wellarchitected:UpdateLensReview
                        Resource: '*'
                      - Sid: AnswerManagement
                        Effect: Allow
                        Action:
                          - wellarchitected:UpdateAnswer
                        Resource: '*'
                      - Sid: MilestoneManagement
                        Effect: Allow
                        Action:
                          - wellarchitected:CreateMilestone
                        Resource: '*'
                      - Sid: WorkloadReadAccess
                        Effect: Allow
                        Action:
                          - wellarchitected:GetWorkload
                          - wellarchitected:GetAnswer
                          - wellarchitected:GetLensReview
                          - wellarchitected:GetLensReviewReport
                          - wellarchitected:GetMilestone
                          - wellarchitected:GetLensVersionDifference
                          - wellarchitected:GetConsolidatedReport
                        Resource: '*'
                      - Sid: WorkloadListAccess
                        Effect: Allow
                        Action:
                          - wellarchitected:ListWorkloads
                          - wellarchitected:ListAnswers
                          - wellarchitected:ListLensReviews
                          - wellarchitected:ListLensReviewImprovements
                          - wellarchitected:ListMilestones
                          - wellarchitected:ListLenses
                          - wellarchitected:ListCheckDetails
                          - wellarchitected:ListCheckSummaries
                          - wellarchitected:ListNotifications
                        Resource: '*'
                      - Sid: WorkloadTagging
                        Effect: Allow
                        Action:
                          - wellarchitected:TagResource
                          - wellarchitected:UntagResource
                          - wellarchitected:ListTagsForResource
                        Resource: '*'
                - PolicyName: DataPlaneReadDeny
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Sid: DenyCustomerDataPlaneReads
                        Effect: Deny
                        Action:
                          - s3-object-lambda:GetObject
                          - dynamodb:GetItem
                          - dynamodb:BatchGetItem
                          - dynamodb:Query
                          - dynamodb:Scan
                          - dynamodb:PartiQLSelect
                          - dax:GetItem
                          - dax:BatchGetItem
                          - dax:Query
                          - dax:Scan
                          - sqs:ReceiveMessage
                          - kinesis:GetRecords
                          - kinesis:GetShardIterator
                          - es:ESHttpGet
                          - es:ESHttpHead
                          - sdb:Select
                          - sdb:GetAttributes
                          - cassandra:Select
                          - timestream:Select
                          - qldb:GetBlock
                          - qldb:GetRevision
                          - qldb:GetDigest
                        Resource: '*'

        Outputs:
          MemberRoleArn:
            Value: !GetAtt ProductXWAFRMemberRole.Arn

Outputs:
  RoleArn:
    Value: !GetAtt ProductXWAFRRole.Arn
  DiscoveryRoleArn:
    Value: !GetAtt CloudelligentDiscoveryRole.Arn
