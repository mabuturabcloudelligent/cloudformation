# =============================================================
# Version: v1.3.0
# Dated: 2026-09-19
# Base: the last Root-OUID template before it was removed (commit 6e551af2,
#       2026-06-11) ? Rules-guarded TargetOUs (comma-separated OU ids,
#       required in org mode), CallAs: SELF, OrganizationalUnitIds via
#       Fn::Split, parallel OperationPreferences.
# Ported from v1.2.0 (2026-09-18), permissions only, nothing structural:
#       hub role WAFRWorkloadManagement + DataPlaneReadDeny policies;
#       ManageCURPolicy; ExistingCURBucket + its policy; CloudelligentDiscoveryRole;
#       BillingReadOnlyRole; ReservedAI-Write (CreateFinOpsRole opt-out); the
#       member template's matching policies + CloudelligentDiscoveryRole; the
#       StackSet's DependsOn on the hub role (member trust policies name it
#       by ARN and IAM rejects a principal that does not exist yet); and the
#       StackSet's ManagedExecution (2026-07-24).
# =============================================================
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ProductX WAFR cross-account read-only role. Single template covers both
  modes ? set EnableOrganizations=yes to additionally provision a StackSet that
  rolls a matching member role out across every account in the targeted OUs.
  Role chain (org mode): Platform ? ProductXWAFRRole ? ProductXWAFRMemberRole.
  Org-mode prerequisite (one-time, in the management account): activate trusted
  access between CloudFormation StackSets and AWS Organizations from the
  CloudFormation ? StackSets console.


Parameters:
  TrustedAccountId:
    Type: String
    Default: '820440428496'
    Description: ProductX platform AWS account ID permitted to assume this role.
  ExternalId:
    Type: String
    NoEcho: true
    Description: Per-account External ID issued by ProductX (confused-deputy protection). Do not change.
  EnableOrganizations:
    Type: String
    Default: 'no'
    AllowedValues: ['yes', 'no']
    Description: >-
      Set to 'yes' if this account is an AWS Organizations management account
      and you want ProductX to scan member accounts too. Requires CloudFormation
      StackSets trusted access to be activated in AWS Organizations first.
      Leave 'no' for single-account onboarding.
  TargetOUs:
    # String (not CommaDelimitedList) so the Rule below can assert non-empty using
    # only Rule-permitted functions (Fn::Select isn't allowed in the Rules block).
    # The StackSet resource still gets a list via Fn::Split on Ref.
    Type: String
    Default: ''
    AllowedPattern: '^$|^(ou|r)-[a-z0-9-]+(,(ou|r)-[a-z0-9-]+)*$'
    ConstraintDescription: >-
      Must be empty (single-account mode) or a comma-separated list of OU ids
      starting with ou- or r- (e.g. r-abc1 or ou-abc1-12abcdef,ou-abc1-34ghijkl).
    Description: >-
      REQUIRED when EnableOrganizations=yes. Organizational Unit IDs to roll
      the member role into ? pass the root OU id (r-xxxx) to cover every
      account in the organization, or comma-separate specific OU IDs
      (ou-xxxx-xxxxxxxx). Ignored when EnableOrganizations=no.

# Rule guard: empty TargetOUs in org mode would produce OrganizationalUnitIds=[''], which
# the StackSet validator rejects with a cryptic regex error mid-CREATE. Asserting here
# means the stack refuses to start with a clear message instead of CREATE_FAILED. The
# Rules block only allows a tiny set of functions (no Fn::Select, no Fn::Join), so this
# relies on TargetOUs being Type: String ? empty-list checks aren't expressible otherwise.
  # The organization enforces a tagging policy by SCP (see the common_tags
  # note in infra/environments/*/main.tf): an untagged CreateRole / CreateStack
  # is denied, which is how every member stack instance failed on 2026-09-19.
  # The same four keys Terraform applies (Project, Environment, ManagedBy,
  # Owner) go on every role here AND on the StackSet, whose tags propagate to
  # each stack instance and the roles inside it. Environment and Owner are
  # parameters so the launch URL can set them (param_Environment=dev).
  Environment:
    Type: String
    Default: 'production'
    Description: Value for the Environment tag on every role this stack creates.
  Owner:
    Type: String
    Default: 'engineering'
    Description: Value for the Owner tag on every role this stack creates.
  ExistingCURBucket:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9.\-]{3,63}$'
    ConstraintDescription: >-
      Single S3 bucket name (DNS-compliant, 3-63 chars).
  CreateFinOpsRole:
    Type: String
    Default: 'yes'
    AllowedValues: ['yes', 'no']
    Description: >-
      Create the ReservedAI-Write FinOps role. Choose 'no' if this account
      already has a role named ReservedAI-Write (IAM role names are unique per
      account and the stack cannot adopt an existing one).

Rules:
  TargetOUsRequiredForOrg:
    RuleCondition: !Equals [!Ref EnableOrganizations, 'yes']
    Assertions:
      - Assert: !Not [!Equals [!Ref TargetOUs, '']]
        AssertDescription: >-
          TargetOUs is required when EnableOrganizations=yes. Provide the root
          OU id (r-xxxx) for all accounts, or specific OU ids (ou-xxxx-xxxxxxxx)
          comma-separated.

Conditions:

Conditions:
  # The Rule above guarantees TargetOUs is non-empty whenever this is true.
  IsOrg: !Equals [!Ref EnableOrganizations, 'yes']
  HasExistingCURBucket: !Not [!Equals [!Ref ExistingCURBucket, '']]
  # ReservedAI assumes this role BY NAME, so the name cannot be made unique;
  # a second copy in one account is a hard CREATE_FAILED, so the customer must
  # be able to opt out when one is already there.
  WantsFinOpsRole: !Equals [!Ref CreateFinOpsRole, 'yes']

Resources:
  ProductXWAFRRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ProductXWAFRRole
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref Owner
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${TrustedAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: ComplianceSignalAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - config:DescribeComplianceByConfigRule
                  - config:GetComplianceDetailsByConfigRule
                  - config:DescribeConfigRules
                  - config:ListDiscoveredResources
                  - securityhub:GetFindings
                  - securityhub:DescribeHub
                  - access-analyzer:ListAnalyzers
                  - access-analyzer:ListFindings
                Resource: '*'
        - PolicyName: WAFRWorkloadManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WorkloadLifecycle
                Effect: Allow
                Action:
                  - wellarchitected:CreateWorkload
                  - wellarchitected:UpdateWorkload
                  - wellarchitected:DeleteWorkload
                Resource: '*'
              - Sid: WorkloadLensManagement
                Effect: Allow
                Action:
                  - wellarchitected:AssociateLenses
                  - wellarchitected:DisassociateLenses
                  - wellarchitected:UpgradeLensReview
                  - wellarchitected:UpdateLensReview
                Resource:
                  - !Sub 'arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*'
              - Sid: AnswerManagement
                Effect: Allow
                Action:
                  - wellarchitected:UpdateAnswer
                Resource:
                  - !Sub 'arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*'
              - Sid: MilestoneManagement
                Effect: Allow
                Action:
                  - wellarchitected:CreateMilestone
                Resource:
                  - !Sub 'arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*'
              - Sid: WorkloadReadAccess
                Effect: Allow
                Action:
                  - wellarchitected:GetWorkload
                  - wellarchitected:GetAnswer
                  - wellarchitected:GetLensReview
                  - wellarchitected:GetLensReviewReport
                  - wellarchitected:GetMilestone
                  - wellarchitected:GetLensVersionDifference
                  - wellarchitected:GetConsolidatedReport
                Resource: '*'
              - Sid: WorkloadListAccess
                Effect: Allow
                Action:
                  - wellarchitected:ListWorkloads
                  - wellarchitected:ListAnswers
                  - wellarchitected:ListLensReviews
                  - wellarchitected:ListLensReviewImprovements
                  - wellarchitected:ListMilestones
                  - wellarchitected:ListLenses
                  - wellarchitected:ListCheckDetails
                  - wellarchitected:ListCheckSummaries
                  - wellarchitected:ListNotifications
                Resource: '*'
              - Sid: WorkloadTagging
                Effect: Allow
                Action:
                  - wellarchitected:TagResource
                  - wellarchitected:UntagResource
                  - wellarchitected:ListTagsForResource
                Resource:
                  - !Sub 'arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*'
        - PolicyName: DataPlaneReadDeny
          # NO S3 OBJECT DENY HERE, by decision (2026-09-19). This policy used
          # to deny s3:GetObject on every bucket except CUR buckets named at
          # stack time ? but the customer picks their CUR bucket in the app
          # AFTER the stack exists, so the deny blocked exactly the bucket the
          # product needs ("explicit deny in an identity-based policy" on the
          # manifest). A name-based exemption cannot work for a bucket that is
          # not known yet, and a pattern-based one (by extension, by tag) would
          # be either a fig leaf or the same landmine. S3 object reads fall
          # under ReadOnlyAccess, as they did before this policy existed.
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyCustomerDataPlaneReads
                Effect: Deny
                Action:
                  - s3-object-lambda:GetObject
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PartiQLSelect
                  - dax:GetItem
                  - dax:BatchGetItem
                  - dax:Query
                  - dax:Scan
                  - sqs:ReceiveMessage
                  - kinesis:GetRecords
                  - kinesis:GetShardIterator
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - sdb:Select
                  - sdb:GetAttributes
                  - cassandra:Select
                  - timestream:Select
                  - qldb:GetBlock
                  - qldb:GetRevision
                  - qldb:GetDigest
                Resource: '*'

  AllowAssumeMemberRoles:
    Type: AWS::IAM::Policy
    Condition: IsOrg
    Properties:
      PolicyName: ProductXWAFRAssumeMemberRoles
      Roles:
        - !Ref ProductXWAFRRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: 'arn:aws:iam::*:role/ProductXWAFRMemberRole'
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId

  ManageCURPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ProductXManageCUR
      Roles:
        - !Ref ProductXWAFRRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cur:DescribeReportDefinitions
            Resource: '*'
          - Effect: Allow
            Action:
              - cur:PutReportDefinition
              - cur:ModifyReportDefinition
              - cur:DeleteReportDefinition
            Resource: 'arn:aws:cur:*:*:definition/productx-*'
          - Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:HeadBucket
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
            Resource: 'arn:aws:s3:::productx-cur-*'
          - Effect: Allow
            Action:
              - s3:ListAllMyBuckets
            Resource: '*'
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub 'arn:aws:s3:::productx-cur-${AWS::AccountId}'
              - !Sub 'arn:aws:s3:::productx-cur-${AWS::AccountId}/*'

  ExistingCURBucketPolicy:
    Type: AWS::IAM::Policy
    Condition: HasExistingCURBucket
    Properties:
      PolicyName: ProductXReadExistingCURBucket
      Roles:
        - !Ref ProductXWAFRRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub 'arn:aws:s3:::${ExistingCURBucket}'
              - !Sub 'arn:aws:s3:::${ExistingCURBucket}/*'

