
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ProductX WAFR cross-account read-only role. Single template covers both
  modes ? set EnableOrganizations=yes to additionally provision a StackSet that
  rolls a matching member role out across every account in the targeted OUs.
  Role chain (org mode): Platform ? ProductXWAFRRole ? ProductXWAFRMemberRole.
  Org-mode prerequisite (one-time, in the management account): activate trusted
  access between CloudFormation StackSets and AWS Organizations from the
  CloudFormation ? StackSets console.


Parameters:
  TrustedAccountId:
    Type: String
    Default: '180528248662'
    Description: ProductX platform AWS account ID permitted to assume this role.
  ExternalId:
    Type: String
    NoEcho: true
    Description: Per-account External ID issued by ProductX (confused-deputy protection). Do not change.
  EnableOrganizations:
    Type: String
    Default: 'no'
    AllowedValues: ['yes', 'no']
    Description: >-
      Set to 'yes' if this account is an AWS Organizations management account
      and you want ProductX to scan member accounts too. Requires CloudFormation
      StackSets trusted access to be activated in AWS Organizations first.
      Leave 'no' for single-account onboarding.
  TargetOUs:
    Type: String
    Default: ''
    AllowedPattern: '^$|^(ou|r)-[a-z0-9-]+(,(ou|r)-[a-z0-9-]+)*$'
    ConstraintDescription: >-
      Must be empty (single-account mode) or a comma-separated list of OU ids
      starting with ou- or r- (e.g. r-abc1 or ou-abc1-12abcdef,ou-abc1-34ghijkl).
    Description: >-
      REQUIRED when EnableOrganizations=yes. Organizational Unit IDs to roll
      the member role into ? pass the root OU id (r-xxxx) to cover every
      account in the organization, or comma-separate specific OU IDs
      (ou-xxxx-xxxxxxxx). Ignored when EnableOrganizations=no.


  Environment:
    Type: String
    Default: 'production'
    Description: Value for the Environment tag on every role this stack creates.
  Owner:
    Type: String
    Default: 'engineering'
    Description: Value for the Owner tag on every role this stack creates.
  ExistingCURBucket:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9.\-]{3,63}$'
    ConstraintDescription: >-
      Single S3 bucket name (DNS-compliant, 3-63 chars).
  CreateFinOpsRole:
    Type: String
    Default: 'yes'
    AllowedValues: ['yes', 'no']
    Description: >-
      Create the ReservedAI-Write FinOps role. Choose 'no' if this account
      already has a role named ReservedAI-Write (IAM role names are unique per
      account and the stack cannot adopt an existing one).

Rules:
  TargetOUsRequiredForOrg:
    RuleCondition: !Equals [!Ref EnableOrganizations, 'yes']
    Assertions:
      - Assert: !Not [!Equals [!Ref TargetOUs, '']]
        AssertDescription: >-
          TargetOUs is required when EnableOrganizations=yes. Provide the root
          OU id (r-xxxx) for all accounts, or specific OU ids (ou-xxxx-xxxxxxxx)
          comma-separated.

Conditions:
  IsOrg: !Equals [!Ref EnableOrganizations, 'yes']
  HasExistingCURBucket: !Not [!Equals [!Ref ExistingCURBucket, '']]
  WantsFinOpsRole: !Equals [!Ref CreateFinOpsRole, 'yes']

Resources:
  ProductXWAFRRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ProductXWAFRRole
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref Owner
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${TrustedAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${TrustedAccountId}:user/billingviewer'
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              AWS: "282762468439"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: "9ba55e7ffef3c1611a511bbbdadbcdbff662b8d9"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies: 
        - PolicyName: WAFRWorkloadManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WorkloadLifecycle
                Effect: Allow
                Action:
                  - wellarchitected:CreateWorkload
                  - wellarchitected:UpdateWorkload
                  - wellarchitected:DeleteWorkload
                Resource: '*'
              - Sid: WorkloadLensManagement
                Effect: Allow
                Action:
                  - wellarchitected:AssociateLenses
                  - wellarchitected:DisassociateLenses
                  - wellarchitected:UpgradeLensReview
                  - wellarchitected:UpdateLensReview
                Resource:
                  - !Sub 'arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*'
              - Sid: AnswerManagement
                Effect: Allow
                Action:
                  - wellarchitected:UpdateAnswer
                Resource:
                  - !Sub 'arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*'
              - Sid: MilestoneManagement
                Effect: Allow
                Action:
                  - wellarchitected:CreateMilestone
                Resource:
                  - !Sub 'arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*'
              - Sid: WorkloadTagging
                Effect: Allow
                Action:
                  - wellarchitected:TagResource
                  - wellarchitected:UntagResource
                  - wellarchitected:ListTagsForResource
                Resource:
                  - !Sub 'arn:aws:wellarchitected:*:${AWS::AccountId}:workload/*'
        - PolicyName: DataPlaneReadDeny
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyCustomerDataPlaneReads
                Effect: Deny
                Action:
                  - s3-object-lambda:GetObject
                  - dynamodb:Query 
                  - dynamodb:Scan
                  - dynamodb:PartiQLSelect
                  - dax:GetItem
                  - dax:BatchGetItem
                  - dax:Query
                  - dax:Scan
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - cassandra:Select 
                  - qldb:GetBlock
                  - qldb:GetRevision
                  - qldb:GetDigest
                Resource: '*'

  AllowAssumeMemberRoles:
    Type: AWS::IAM::Policy
    Condition: IsOrg
    Properties:
      PolicyName: ProductXWAFRAssumeMemberRoles
      Roles:
        - !Ref ProductXWAFRRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: 'arn:aws:iam::*:role/ProductXWAFRMemberRole'
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId

  ManageCURPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ProductXManageCUR
      Roles:
        - !Ref ProductXWAFRRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cur:DescribeReportDefinitions
            Resource: '*'
          - Effect: Allow
            Action:
              - cur:PutReportDefinition
              - cur:ModifyReportDefinition
              - cur:DeleteReportDefinition
            Resource: 'arn:aws:cur:*:*:definition/productx-*'
          - Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:HeadBucket
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
            Resource: 'arn:aws:s3:::productx-cur-*'
          - Effect: Allow
            Action:
              - s3:ListAllMyBuckets
            Resource: '*'
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub 'arn:aws:s3:::productx-cur-${AWS::AccountId}'
              - !Sub 'arn:aws:s3:::productx-cur-${AWS::AccountId}/*'

  ExistingCURBucketPolicy:
    Type: AWS::IAM::Policy
    Condition: HasExistingCURBucket
    Properties:
      PolicyName: ProductXReadExistingCURBucket
      Roles:
        - !Ref ProductXWAFRRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub 'arn:aws:s3:::${ExistingCURBucket}'
              - !Sub 'arn:aws:s3:::${ExistingCURBucket}/*'


  CloudelligentFinOpsRole:
    Type: AWS::IAM::Role
    Condition: WantsFinOpsRole
    Properties:
      RoleName: ReservedAI-Write
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref Owner
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::967800896805:user/reserved-write
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: "8ab6faee-ffc1-4302-93a3-98daf7178208"
      Policies:
        - PolicyName: ReservedAI-Write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - 'ce:*'
                  - 'pricing:*'
                  - 'sts:GetCallerIdentity'
                  - 'servicequotas:GetServiceQuota'
                  - 'servicequotas:GetRequestedServiceQuotaChange'
                  - 'servicequotas:GetAWSDefaultServiceQuota'
                  - 'servicequotas:ListServices'
                  - 'servicequotas:ListServiceQuotas'
                  - 'servicequotas:ListRequestedServiceQuotaChangeHistoryByQuota'
                  - 'servicequotas:RequestServiceQuotaIncrease'
                  - 'cloudtrail:LookupEvents'
                  - 'cur:DescribeReportDefinitions'
                  - 'ec2:DescribeAccountAttributes'
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeRegions'
                  - 'ec2:DescribeAvailabilityZones'
                  - 'ec2:CreateSpotDatafeedSubscription'
                  - 'ec2:DescribeSpotDatafeedSubscription'
                  - 'ec2:DescribeSpotFleetInstances'
                  - 'ec2:DescribeSpotFleetRequestHistory'
                  - 'ec2:DescribeSpotFleetRequests'
                  - 'ec2:DescribeSpotInstanceRequests'
                  - 'ec2:DescribeSpotPriceHistory'
                  - 'ec2:DescribeFleetHistory'
                  - 'ec2:DescribeFleetInstances'
                  - 'ec2:DescribeFleets'
                  - 'ec2:DescribeTags'
                  - 'tag:GetResources'
                  - 'resource-groups:GetGroupQuery'
                  - 'resource-groups:SearchResources'
                  - 'resource-groups:GetGroup'
                  - 'resource-groups:GetGroupConfiguration'
                  - 'resource-groups:GetTags'
                  - 'resource-groups:ListGroupResources'
                  - 'resource-groups:ListGroups'
                  - 'ec2:DescribeAddresses'
                  - 'ec2:DescribeMovingAddresses'
                  - 'ec2:DescribeVolumes'
                  - 'ec2:DescribeVolumesModifications'
                  - 'ec2:DescribeVolumeStatus'
                  - 'ec2:DescribeElasticGpus'
                  - 'ec2:DescribeScheduledInstances'
                  - 'ec2:DescribeScheduledInstanceAvailability'
                  - 'ec2:DescribeReservedInstances'
                  - 'ec2:DescribeReservedInstancesModifications'
                  - 'ec2:DescribeReservedInstancesListings'
                  - 'ec2:GetReservedInstancesExchangeQuote'
                  - 'ec2:DescribeReservedInstancesOfferings'
                  - 'ec2:DescribeCapacityReservations'
                  - 'ec2:DescribeHosts'
                  - 'ec2:DescribeHostReservations'
                  - 'ec2:GetHostReservationPurchasePreview'
                  - 'ec2:DescribeHostReservationOfferings'
                  - 'ec2:DescribeCapacityBlockOfferings'
                  - 'organizations:DescribeOrganization'
                  - 'organizations:ListAccounts'
                  - 'organizations:DescribeAccount'
                  - 'savingsplans:DescribeSavingsPlansOfferingRates'
                  - 'savingsplans:DescribeSavingsPlansOfferings'
                  - 'savingsplans:DescribeSavingsPlans'
                  - 'savingsplans:DescribeSavingsPlanRates'
                  - 'rds:DescribeReservedDBInstances'
                  - 'rds:DescribeReservedDBInstancesOfferings'
                  - 'redshift:DescribeReservedNodeOfferings'
                  - 'redshift:DescribeReservedNodes'
                  - 'dynamodb:DescribeReservedCapacity'
                  - 'dynamodb:DescribeReservedCapacityOfferings'
                  - 'elasticache:DescribeReservedCacheNodes'
                  - 'elasticache:DescribeReservedCacheNodesOfferings'
                  - 'memorydb:DescribeReservedNodes'
                  - 'memorydb:DescribeReservedNodesOfferings'
                  - 'es:DescribeReservedElasticsearchInstanceOfferings'
                  - 'es:DescribeReservedElasticsearchInstances'
                  - 'ec2:ModifyReservedInstances'
                  - 'ec2:PurchaseReservedInstancesOffering'
                  - 'ec2:AcceptReservedInstancesExchangeQuote'
                  - 'ec2:CreateReservedInstancesListing'
                  - 'ec2:CancelReservedInstancesListing'
                  - 'ec2:PurchaseScheduledInstances'
                  - 'ec2:RunScheduledInstances'
                  - 'ec2:ModifyCapacityReservation'
                  - 'ec2:ModifyInstanceCapacityReservationAttributes'
                  - 'ec2:CreateCapacityReservation'
                  - 'ec2:CancelCapacityReservation'
                  - 'ec2:PurchaseHostReservation'
                  - 'elasticache:PurchaseReservedCacheNodesOffering'
                  - 'memorydb:PurchaseReservedNodesOffering'
                  - 'rds:PurchaseReservedDbInstancesOffering'
                  - 'redshift:PurchaseReservedNodeOffering'
                  - 'redshift:AcceptReservedNodeExchange'
                  - 'es:PurchaseReservedElasticsearchInstanceOffering'
                  - 'savingsplans:CreateSavingsPlan'
                  - 'savingsplans:DeleteQueuedSavingsPlan'
                  - 'organizations:InviteAccountToOrganization'
                  - 'organizations:RemoveAccountFromOrganization'
                  - 'organizations:CreateAccount'
                  - 'organizations:MoveAccount'
                Resource:
                  - '*'
              - Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource:
                  - arn:aws:iam::*:role/aws-service-role/*
              - Effect: Allow
                Action:
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:SimulatePrincipalPolicy
                Resource:
                  - arn:aws:iam::*:role/ReservedAI-Write
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:ListBucket
                  - s3:PutBucketPolicy
                Resource:
                  - arn:aws:s3:::reserved-ai-cur-*
                  - arn:aws:s3:::reserved-ai-spot-*
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - arn:aws:s3:::reserved-ai-cur-*/*
                  - arn:aws:s3:::reserved-ai-spot-*/*
              - Effect: Allow
                Action:
                  - cur:PutReportDefinition
                Resource:
                  - arn:aws:cur:*:*:definition/reserved-ai-*

  ProductXWAFRMemberRoleStackSet:
    Type: AWS::CloudFormation::StackSet
    Condition: IsOrg
    DependsOn: ProductXWAFRRole
    Properties:
      StackSetName: ProductXWAFRMemberRoleStackSet
      Description: Deploys ProductXWAFRMemberRole to organization member accounts.
      PermissionModel: SERVICE_MANAGED
      CallAs: SELF
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_NAMED_IAM
      Tags:
        - Key: Project
          Value: productx
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref Owner
      ManagedExecution:
        Active: true
      OperationPreferences:
        MaxConcurrentCount: 10
        FailureToleranceCount: 5
        RegionConcurrencyType: PARALLEL
      Parameters:
        - ParameterKey: ManagementAccountId
          ParameterValue: !Ref 'AWS::AccountId'
        - ParameterKey: ExternalId
          ParameterValue: !Ref ExternalId
        - ParameterKey: Environment
          ParameterValue: !Ref Environment
        - ParameterKey: Owner
          ParameterValue: !Ref Owner
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds: !Split [',', !Ref TargetOUs]
          Regions:
            - !Ref 'AWS::Region'
      TemplateBody: |
        AWSTemplateFormatVersion: '2010-09-09'
        Description: ProductX WAFR member account read-only role (StackSet-deployed).

        Parameters:
          ManagementAccountId:
            Type: String
          ExternalId:
            Type: String
            NoEcho: true
          Environment:
            Type: String
          Owner:
            Type: String

        Resources:
          ProductXWAFRMemberRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: ProductXWAFRMemberRole
              Tags:
                - Key: Project
                  Value: productx
                - Key: Environment
                  Value: !Ref Environment
                - Key: ManagedBy
                  Value: cloudformation
                - Key: Owner
                  Value: !Ref Owner
              AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                      AWS: !Sub 'arn:aws:iam::${ManagementAccountId}:root'
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        sts:ExternalId: !Ref ExternalId
                        aws:PrincipalArn: !Sub 'arn:aws:iam::${ManagementAccountId}:role/ProductXWAFRRole'
                  - Effect: Allow
                    Principal:
                      AWS: "282762468439"
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        sts:ExternalId: "9ba55e7ffef3c1611a511bbbdadbcdbff662b8d9"
              ManagedPolicyArns:
                - arn:aws:iam::aws:policy/SecurityAudit
                - arn:aws:iam::aws:policy/ReadOnlyAccess
              Policies:
                - PolicyName: WAFRWorkloadManagement
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Sid: WorkloadLifecycle
                        Effect: Allow
                        Action:
                          - wellarchitected:CreateWorkload
                          - wellarchitected:UpdateWorkload
                          - wellarchitected:DeleteWorkload
                        Resource: '*'
                      - Sid: WorkloadLensManagement
                        Effect: Allow
                        Action:
                          - wellarchitected:AssociateLenses
                          - wellarchitected:DisassociateLenses
                          - wellarchitected:UpgradeLensReview
                          - wellarchitected:UpdateLensReview
                        Resource: '*'
                      - Sid: AnswerManagement
                        Effect: Allow
                        Action:
                          - wellarchitected:UpdateAnswer
                        Resource: '*'
                      - Sid: MilestoneManagement
                        Effect: Allow
                        Action:
                          - wellarchitected:CreateMilestone
                        Resource: '*'
                      - Sid: WorkloadTagging
                        Effect: Allow
                        Action:
                          - wellarchitected:TagResource
                          - wellarchitected:UntagResource
                          - wellarchitected:ListTagsForResource
                        Resource: '*'
                - PolicyName: DataPlaneReadDeny
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Sid: DenyCustomerDataPlaneReads
                        Effect: Deny
                        Action:
                          - s3-object-lambda:GetObject
                          - dynamodb:Query
                          - dynamodb:Scan
                          - dynamodb:PartiQLSelect
                          - dax:GetItem
                          - dax:BatchGetItem
                          - dax:Query
                          - dax:Scan
                          - es:ESHttpGet
                          - es:ESHttpHead
                          - cassandra:Select
                          - qldb:GetBlock
                          - qldb:GetRevision
                          - qldb:GetDigest
                        Resource: '*'

        Outputs:
          MemberRoleArn:
            Value: !GetAtt ProductXWAFRMemberRole.Arn

Outputs:
  RoleArn:
    Value: !GetAtt ProductXWAFRRole.Arn
